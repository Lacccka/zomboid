name: Lifestyle translation and Yoga proxy audit

on:
  push:
    branches:
      - agent/b42-20-compatibility-patch
    paths:
      - '3403870858/mods/Lifestyle/common/media/lua/shared/Translate/EN/**'
      - '3403870858/mods/Lifestyle/common/media/lua/client/Helper/HSMng.lua'
      - '3403870858/mods/Lifestyle/common/media/lua/client/XpSystem/ISUI/LSSOSkills.lua'
      - '3403870858/mods/Lifestyle/common/media/perks.txt'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/perks.txt'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/client/zzz_LCC_LifestyleYogaProgress.lua'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/shared/Translate/RU/**'
      - 'tools/audit_lifestyle_translation.py'
      - 'tools/audit_lifestyle_yoga_proxy.py'
      - '.github/workflows/lifestyle-translation-audit.yml'
  pull_request:
    paths:
      - '3403870858/mods/Lifestyle/common/media/lua/shared/Translate/EN/**'
      - '3403870858/mods/Lifestyle/common/media/lua/client/Helper/HSMng.lua'
      - '3403870858/mods/Lifestyle/common/media/lua/client/XpSystem/ISUI/LSSOSkills.lua'
      - '3403870858/mods/Lifestyle/common/media/perks.txt'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/perks.txt'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/client/zzz_LCC_LifestyleYogaProgress.lua'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/shared/Translate/RU/**'
      - 'tools/audit_lifestyle_translation.py'
      - 'tools/audit_lifestyle_yoga_proxy.py'
      - '.github/workflows/lifestyle-translation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translation:
    name: Lifestyle Russian translation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile translation audit
        run: python3 -m py_compile tools/audit_lifestyle_translation.py

      - name: Validate translation JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find \
            3403870858/mods/Lifestyle/common/media/lua/shared/Translate/EN \
            LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/shared/Translate/RU \
            -type f -name '*.json' -print0)

      - name: Audit Lifestyle Russian translation
        run: python3 tools/audit_lifestyle_translation.py

  yoga:
    name: Lifestyle Yoga proxy contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Yoga proxy audit
        run: python3 -m py_compile tools/audit_lifestyle_yoga_proxy.py

      - name: Audit Lifestyle Yoga proxy contract
        run: python3 tools/audit_lifestyle_yoga_proxy.py
