name: Lifestyle translation and Yoga proxy audit

on:
  push:
    branches:
      - agent/b42-20-compatibility-patch
    paths:
      - '3403870858/mods/Lifestyle/common/media/lua/shared/Translate/EN/**'
      - '3403870858/mods/Lifestyle/common/media/lua/client/Helper/HSMng.lua'
      - '3403870858/mods/Lifestyle/common/media/lua/client/XpSystem/ISUI/LSSOSkills.lua'
      - '3403870858/mods/Lifestyle/common/media/perks.txt'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/perks.txt'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/client/zzz_LCC_LifestyleYogaProgress.lua'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/shared/Translate/RU/**'
      - 'tools/audit_lifestyle_translation.py'
      - 'tools/audit_lifestyle_yoga_proxy.py'
      - '.github/workflows/lifestyle-translation-audit.yml'
  pull_request:
    paths:
      - '3403870858/mods/Lifestyle/common/media/lua/shared/Translate/EN/**'
      - '3403870858/mods/Lifestyle/common/media/lua/client/Helper/HSMng.lua'
      - '3403870858/mods/Lifestyle/common/media/lua/client/XpSystem/ISUI/LSSOSkills.lua'
      - '3403870858/mods/Lifestyle/common/media/perks.txt'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/perks.txt'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/client/zzz_LCC_LifestyleYogaProgress.lua'
      - 'LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/shared/Translate/RU/**'
      - 'tools/audit_lifestyle_translation.py'
      - 'tools/audit_lifestyle_yoga_proxy.py'
      - '.github/workflows/lifestyle-translation-audit.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  translation:
    name: Lifestyle Russian translation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile translation audit
        run: python3 -m py_compile tools/audit_lifestyle_translation.py

      - name: Validate translation JSON syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done < <(find \
            3403870858/mods/Lifestyle/common/media/lua/shared/Translate/EN \
            LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/shared/Translate/RU \
            -type f -name '*.json' -print0)

      - name: Audit Lifestyle Russian translation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 tools/audit_lifestyle_translation.py 2>&1 | tee /tmp/lifestyle-translation-audit.log
          audit_status=${PIPESTATUS[0]}
          set -e

          if [ "$audit_status" -ne 0 ]; then
            diagnostic="$(python3 - <<'PY'
          from pathlib import Path

          lines = Path('/tmp/lifestyle-translation-audit.log').read_text(encoding='utf-8', errors='replace').splitlines()
          mode = None
          for raw in lines:
              line = raw.strip()
              if line == 'Missing:':
                  mode = 'missing'
                  continue
              if line == 'Placeholder mismatches:':
                  mode = 'placeholder'
                  continue
              if mode and line and not line.startswith('Extra/custom') and not line.startswith('Intentional original'):
                  print(f'{mode}: {line}'[:140])
                  break
          else:
              summary = next((line.strip() for line in reversed(lines) if line.strip()), 'translation audit failed')
              print(summary[:140])
          PY
          )"
            diagnostic_context="$(printf '%s' "$diagnostic" | tr -cs 'A-Za-z0-9._:-' '_' | cut -c1-72)"

            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state=failure \
              -f context="lcc/translation/${diagnostic_context}" \
              -f description="$diagnostic" >/dev/null
            exit "$audit_status"
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='lcc/translation/ok' \
            -f description='Lifestyle Russian translation audit passed' >/dev/null

  yoga:
    name: Lifestyle Yoga proxy contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile Yoga proxy audit
        run: python3 -m py_compile tools/audit_lifestyle_yoga_proxy.py

      - name: Audit Lifestyle Yoga proxy contract
        run: python3 tools/audit_lifestyle_yoga_proxy.py
