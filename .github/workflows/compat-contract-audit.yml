name: Compatibility contract audit

on:
  push:
    paths:
      - "3268487204/mods/Bandits/42.20/media/lua/**"
      - "LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/**"
      - "LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/perks.txt"
      - "server/linux/start-server.sh"
      - ".gitattributes"
      - "tools/compat_contracts.json"
      - "tools/audit_compat_contracts.py"
      - ".github/workflows/compat-contract-audit.yml"
  pull_request:
    paths:
      - "3268487204/mods/Bandits/42.20/media/lua/**"
      - "LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/**"
      - "LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/perks.txt"
      - "server/linux/start-server.sh"
      - ".gitattributes"
      - "tools/compat_contracts.json"
      - "tools/audit_compat_contracts.py"
      - ".github/workflows/compat-contract-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify compatibility contracts
        run: python3 tools/audit_compat_contracts.py
      - name: Verify cross-platform patch invariants
        shell: bash
        run: |
          PERKS='LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/perks.txt'

          if grep -nE '^[[:space:]]*--' "${PERKS}"; then
            echo 'perks.txt uses Lua-style comments that the B42 CustomPerks parser rejects'
            exit 1
          fi

          # Our Yoga registration must preserve every Lifestyle perk from the
          # upstream perks.txt rather than replacing the file with Yoga alone.
          for perk in Lifestyle Art Cleaning Dancing Meditation Music Yoga; do
            grep -E "^perk[[:space:]]+${perk}$" "${PERKS}" >/dev/null
          done

          bash -n server/linux/start-server.sh

          for mod_name in \
            'Bandits' \
            'Lifestyle' \
            'Escape from Kentucky4215' \
            'tsarslib'; do
            grep -F '"'"${mod_name}"'"' server/linux/start-server.sh >/dev/null
          done

          grep -F '"${media_dir}/animsets"' server/linux/start-server.sh >/dev/null
          grep -F '"${mods_dir}/${lowercase_name}"' server/linux/start-server.sh >/dev/null

          RU_PERKS='LaccckaCompatibilityPatch/Contents/mods/LaccckaCompatibilityPatch/42/media/lua/shared/Translate/RU/ZZ_LCC_Perks_RU.txt'
          for key in Art Cleaning Dancing Meditation Music Yoga; do
            grep -F "IGUI_perks_${key}_Description" "${RU_PERKS}" >/dev/null
          done

          grep -F '3 ур.:' "${RU_PERKS}" >/dev/null
          grep -F '6 ур.:' "${RU_PERKS}" >/dev/null
          grep -F '10 ур.:' "${RU_PERKS}" >/dev/null

          if grep -Ei 'hidden skill|technical skill|скрыт(ый|ого).*навык|техническ(ий|ого).*навык' "${RU_PERKS}"; then
            echo 'Player-facing perk descriptions contain implementation jargon'
            exit 1
          fi
