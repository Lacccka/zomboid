name: Materialize Bandits Dev PoC

on:
  push:
    branches:
      - agent/b42-20-compatibility-patch
    paths:
      - .github/workflows/_lcc_materialize_bandits_dev_poc.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b42-20-compatibility-patch
          fetch-depth: 0

      - name: Materialize upstream-pursuit-v1
        shell: python
        run: |
          from pathlib import Path

          path = Path("WorkshopPatches/Bandits-LCC-Dev/42.20/media/lua/client/BanditUpdate.lua")
          text = path.read_text(encoding="utf-8")

          header_original = 'require "BanditZombie"\n\nlocal sum1 = 0'
          header_poc = '''require "BanditZombie"

-- [LCC POC] Local B42.20.3 reference implementation; this working copy is for controlled testing.
LCC_BANDITS_ATTACK_BRIDGE_POC = "upstream-pursuit-v1"
print("[LCC][BanditsAttackPoC][INIT] upstream-pursuit-v1 active; vanilla spotted/addAggro/setTarget/setAttackedBy bridge disabled")

local sum1 = 0'''

          bridge_original = '''                    if zombie and bandit then
                        zombie:spotted(bandit, true)
                        zombie:addAggro(bandit, 1)
                        zombie:setTarget(bandit)
                        zombie:setAttackedBy(bandit)
                    
                        --[[
                        zombie:spotted(bandit, true)
                        zombie:setTarget(bandit)
                        zombie:setAttackedBy(bandit)
                        ]]
                    end'''

          bridge_poc = '''                    if zombie and bandit then
                        -- [LCC POC] Keep Bandits' own pursuit / Bite pipeline without
                        -- constructing a vanilla zombie -> Bandit combat relationship.
                        zombie:pathToCharacter(bandit)
                    end'''

          is_original = (
              text.count(header_original) == 1
              and text.count(header_poc) == 0
              and text.count(bridge_original) == 1
              and text.count(bridge_poc) == 0
          )
          is_poc = (
              text.count(header_original) == 0
              and text.count(header_poc) == 1
              and text.count(bridge_original) == 0
              and text.count(bridge_poc) == 1
          )

          if is_poc:
              print("Bandits dev working copy is already materialized as upstream-pursuit-v1")
          elif is_original:
              text = text.replace(header_original, header_poc, 1)
              text = text.replace(bridge_original, bridge_poc, 1)
              path.write_text(text, encoding="utf-8", newline="")
              print("Materialized upstream-pursuit-v1 in Bandits-LCC-Dev")
          else:
              raise SystemExit("Refusing to patch: BanditUpdate.lua no longer matches either audited baseline or complete PoC state")

      - name: Verify materialized file
        shell: bash
        run: |
          set -euo pipefail
          f='WorkshopPatches/Bandits-LCC-Dev/42.20/media/lua/client/BanditUpdate.lua'
          grep -F 'LCC_BANDITS_ATTACK_BRIDGE_POC = "upstream-pursuit-v1"' "$f"
          grep -F 'zombie:pathToCharacter(bandit)' "$f"
          if grep -Fq 'zombie:addAggro(bandit, 1)' "$f"; then
            echo 'unsafe original Bandit bridge is still present' >&2
            exit 1
          fi
          if grep -Fq 'zombie:setTarget(bandit)' "$f"; then
            echo 'unsafe original Bandit target assignment is still present' >&2
            exit 1
          fi
          git diff --check

      - name: Commit working-copy materialization
        shell: bash
        run: |
          set -euo pipefail
          f='WorkshopPatches/Bandits-LCC-Dev/42.20/media/lua/client/BanditUpdate.lua'
          if git diff --quiet -- "$f"; then
            echo 'No materialization change required.'
            exit 0
          fi
          git config user.name 'LCC compatibility automation'
          git config user.email '101393701+Lacccka@users.noreply.github.com'
          git add -- "$f"
          git commit -m 'Materialize Bandits upstream attack bridge PoC'
          git push origin HEAD:agent/b42-20-compatibility-patch
