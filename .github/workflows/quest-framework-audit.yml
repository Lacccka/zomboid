name: Quest Framework audit

on:
  push:
    paths:
      - 'WorkshopPatches/QuestFramework/**'
      - 'WorkshopPatches/NPCFixes/Contents/mods/LaccckaB4220NPCFixes/42/media/lua/client/BanditUpdate.lua'
      - '.github/workflows/quest-framework-audit.yml'
  pull_request:
    paths:
      - 'WorkshopPatches/QuestFramework/**'
      - 'WorkshopPatches/NPCFixes/Contents/mods/LaccckaB4220NPCFixes/42/media/lua/client/BanditUpdate.lua'
      - '.github/workflows/quest-framework-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua syntax checker
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 ripgrep

      - name: Validate audit script syntax
        run: |
          bash -n WorkshopPatches/QuestFramework/audit.sh
          bash -n WorkshopPatches/QuestFramework/audit-relationships.sh
          bash -n WorkshopPatches/QuestFramework/audit-factions.sh
          bash -n WorkshopPatches/QuestFramework/audit-faction-relationships.sh
          bash -n WorkshopPatches/QuestFramework/audit-branching.sh
          bash -n WorkshopPatches/QuestFramework/audit-rpg-hub-cross-navigation.sh
          bash -n WorkshopPatches/QuestFramework/audit-faction-sites.sh
          bash -n WorkshopPatches/QuestFramework/audit-faction-lifecycle.sh
          bash -n WorkshopPatches/QuestFramework/audit-faction-health.sh
          bash -n WorkshopPatches/QuestFramework/audit-faction-operations.sh

      - name: Validate all Quest Framework Lua syntax
        run: |
          while IFS= read -r -d '' file; do
            lua5.4 -e "assert(loadfile([[$file]]))"
          done < <(find WorkshopPatches/QuestFramework/Contents/mods/LaccckaQuestFramework/42/media/lua -type f -name '*.lua' -print0)

      - name: Verify Quest Framework contracts
        run: bash WorkshopPatches/QuestFramework/audit.sh

      - name: Verify NPC relationship contracts
        run: bash WorkshopPatches/QuestFramework/audit-relationships.sh

      - name: Verify faction discovery contracts
        run: bash WorkshopPatches/QuestFramework/audit-factions.sh

      - name: Verify faction relationship contracts
        run: bash WorkshopPatches/QuestFramework/audit-faction-relationships.sh

      - name: Verify branching contracts
        run: bash WorkshopPatches/QuestFramework/audit-branching.sh

      - name: Verify RPG Hub cross-navigation contracts
        run: bash WorkshopPatches/QuestFramework/audit-rpg-hub-cross-navigation.sh

      - name: Verify autonomous faction site contracts
        run: bash WorkshopPatches/QuestFramework/audit-faction-sites.sh

      - name: Verify faction lifecycle contracts
        run: bash WorkshopPatches/QuestFramework/audit-faction-lifecycle.sh

      - name: Verify faction site health contracts
        run: bash WorkshopPatches/QuestFramework/audit-faction-health.sh

      - name: Verify faction operations contracts
        run: bash WorkshopPatches/QuestFramework/audit-faction-operations.sh
