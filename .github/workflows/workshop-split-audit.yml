name: Workshop split audit

on:
  push:
    paths:
      - 'LaccckaCompatibilityPatch/**'
      - 'WorkshopProjects/**'
      - 'WorkshopPatches/**'
      - 'tools/audit_workshop_split.py'
      - 'tools/audit_wellness_proxy.py'
      - 'tools/audit_survivor_ai_guards.py'
      - '.github/workflows/workshop-split-audit.yml'
  pull_request:
    paths:
      - 'LaccckaCompatibilityPatch/**'
      - 'WorkshopProjects/**'
      - 'WorkshopPatches/**'
      - 'tools/audit_workshop_split.py'
      - 'tools/audit_wellness_proxy.py'
      - 'tools/audit_survivor_ai_guards.py'
      - '.github/workflows/workshop-split-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify existing Workshop projects
        run: python3 tools/audit_workshop_split.py
      - name: Verify new grouped Workshop patches
        run: bash WorkshopPatches/audit_split.sh
      - name: Verify Wellness Yoga proxy contract
        run: python3 tools/audit_wellness_proxy.py
      - name: Verify Survivor AI guard contracts
        run: python3 tools/audit_survivor_ai_guards.py
